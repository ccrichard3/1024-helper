name: traffic

# GitHub keeps only 14 days of traffic and only shows it to admins, so the history has
# to be recorded here to survive. `traffic/history.json` accumulates one entry per day;
# `traffic/views.svg` is redrawn from it and embedded in the README.
on:
  # 每日定时已关闭：README 改用 Star History 的图，这里记录的数据暂时没人看。
  # 想恢复访问量曲线，把下面两行 schedule 取消注释即可。
  # schedule:
  #   - cron: "23 1 * * *"   # daily, 09:23 UTC+8
  workflow_dispatch:
  push:
    paths:
      - "scripts/traffic_chart.py"
      - ".github/workflows/traffic.yml"

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies: the script only uses the standard library.
      - name: Record traffic and redraw the chart
        env:
          # Traffic is admin-only. The workflow token is not an admin, so a repository
          # secret named TRAFFIC_TOKEN (a PAT with Administration: read) is required;
          # without it the script logs why and exits cleanly instead of failing the run.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/traffic_chart.py

      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/history.json traffic/views.svg
          if git diff --cached --quiet; then
            echo "nothing to record"
          else
            git commit -m "traffic: record $(date -u +%F)"
            git push
          fi

name: traffic

# GitHub keeps only 14 days of traffic and only shows it to admins, so the history has
# to be recorded here to survive. `traffic/history.json` accumulates one entry per day;
# `traffic/views.svg` is redrawn from it and embedded in the README.
on:
  schedule:
    - cron: "23 1 * * *"   # daily, 09:23 UTC+8
  workflow_dispatch:
  push:
    paths:
      - "scripts/traffic_chart.py"
      - ".github/workflows/traffic.yml"

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies: the script only uses the standard library.
      - name: Record traffic and redraw the chart
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/traffic_chart.py

      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/history.json traffic/views.svg
          if git diff --cached --quiet; then
            echo "nothing to record"
          else
            git commit -m "traffic: record $(date -u +%F)"
            git push
          fi
